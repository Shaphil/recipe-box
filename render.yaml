databases:
  - name: andromeda
    plan: free
    databaseName: recipe-box
    user: recipe-box

services:
  - type: web
    plan: free
    name: recipe-box
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn recipe_box.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: andromeda
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4